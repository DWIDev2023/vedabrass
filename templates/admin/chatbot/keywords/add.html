{% extends "layouts/admin.html" %}
{% load static %}
{% block title %}Vedabrass | Add Chat Keyword{% endblock %}
{% block content %}
    {% if messages %}
        <div class="message-container">
            {% for message in messages %}
            <div class="alert {{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
    {% endif %}

    <section class="category-section">
        <div class="category-container">
            <h2 class="section-title">Add Chat Keyword</h2>
            <form class="category-form" method="POST" action="{% url 'AdminAddChatKeywords' user.unique_code %}">
                {% csrf_token %}
                <div class="form-group">
                    <label>Keyword</label>
                    <input type="text"name="keyword" placeholder="Enter keyword" required>
                </div>
                <div class="form-group">
                    <label>Priority</label>
                    <input type="number" name="priority" value="10" min="1" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="category" name="category">
                        <option value="" hidden>Select Category</option>
                        {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Collection</label>
                    <select id="collection" name="collection">
                        <option value="" hidden>Select Collection</option>
                        {% for collection in collections %}
                        <option value="{{ collection.id }}">{{ collection.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Tag</label>
                    <select name="tag">
                        <option value="">Select Tag</option>
                        {% for tag in tags %}
                        <option value="{{ tag.id }}">{{ tag.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select name="is_active">
                        <option value="True" selected>Active</option>
                        <option value="False">Inactive</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Save Keyword</button>
                </div>
            </form>
        </div>
    </section>
{% endblock %}
