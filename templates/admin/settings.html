{% extends "layouts/admin.html" %}
{% load static %}
{% block title %}Vedabrass | Dashboard{% endblock %}
{% block content %}
    {% if messages %}
        <div class="message-container">
            {% for message in messages %}
            <div class="alert {{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
    {% endif %}

    
{% endblock %}
