{% extends "layouts/admin.html" %}
{% load static %}
{% block title %}Vedabrass | Edit Vendor Details{% endblock %}
{% block content %}
    {% if messages %}
        <div class="message-container">
            {% for message in messages %}
            <div class="alert {{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
    {% endif %}
    
    <section class="category-section">
        <div class="category-container">
            <h2 class="section-title">Edit Vendor Details</h2>

            <form class="category-form" method="POST" action="{% url 'AdminEditVendor' vendor.unique_code %}" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group">
                    <label>Vendor Name</label>
                    <input type="text" name="name" placeholder="Enter vendor name" value="{{ vendor.name }}" required />
                </div>
                <div class="form-group">
                    <label>Vendor Code</label>
                    <input type="text" name="vcode" placeholder="Enter vendor code" value="{{ vendor.vendor_code }}" required />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Enter email address" value="{{ vendor.email }}" />
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" name="mobile" minlength="10" maxlength="10" placeholder="Enter mobile number" value="{{ vendor.mobile }}" />
                </div>
                <div class="form-group full">
                    <label>Address</label>
                    <input type="text" name="mobile" placeholder="Enter address" value="{{ vendor.address }}" />
                </div>
                <div class="form-group">
                    <label>City</label>
                    <select name="city" required>
                        <option value="Hyderabad" {% if vendor.city == 'Hyderabad' %}selected{% endif %}>Hyderabad</option>
                        <option value="Aligarh" {% if vendor.city == 'Aligarh' %}selected{% endif %}>Aligarh</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>State Code</label>
                    <input type="text" name="state" placeholder="e.g. TS" value="{{ vendor.state }}" />
                </div>
                <div class="form-group">
                    <label>Country</label>
                    <input type="text" name="country" placeholder="Enter country" value="{{ vendor.country }}" />
                </div>
                <div class="form-group">
                    <label>Zip / Postal Code</label>
                    <input type="text" name="zip" placeholder="Enter zip / postal code" value="{{ vendor.zip }}" />
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select name="is_active" required>
                        <option value="True" {% if vendor.is_active %}selected{% endif %}>Active</option>
                        <option value="False" {% if not vendor.is_active %}selected{% endif %}>Inactive</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </section>
{% endblock %}
