{% extends "layouts/admin.html" %}
{% load static %}
{% block title %}Vedabrass | Add New Vendor{% endblock %}
{% block content %}
    {% if messages %}
        <div class="message-container">
            {% for message in messages %}
            <div class="alert {{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
    {% endif %}
    
    <section class="category-section">
        <div class="category-container">
            <h2 class="section-title">Add New Vendor</h2>

            <form class="category-form" method="POST" action="{% url 'AdminNewVendor' user.unique_code %}" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group">
                    <label>Vendor Name</label>
                    <input type="text" name="name" placeholder="Enter vendor name" required />
                </div>
                <div class="form-group">
                    <label>Vendor Code</label>
                    <input type="text" name="vcode" placeholder="Enter vendor code" required />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Enter email address" />
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" name="mobile" minlength="10" maxlength="10" placeholder="Enter mobile number" />
                </div>
                <div class="form-group full">
                    <label>Address</label>
                    <input type="text" name="mobile" placeholder="Enter address" />
                </div>
                <div class="form-group">
                    <label>City</label>
                    <select name="city" required>
                        <option value="Hyderabad" selected>Hyderabad</option>
                        <option value="Aligarh">Aligarh</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>State Code</label>
                    <input type="text" name="state" placeholder="e.g. TS" />
                </div>
                <div class="form-group">
                    <label>Country</label>
                    <input type="text" name="country" placeholder="Enter country" value="India" />
                </div>
                <div class="form-group">
                    <label>Zip / Postal Code</label>
                    <input type="text" name="zip" placeholder="Enter zip / postal code" />
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select name="is_active" required>
                        <option value="True" selected>Active</option>
                        <option value="False">Inactive</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Save Vendor Details</button>
                </div>
            </form>
        </div>
    </section>
{% endblock %}
