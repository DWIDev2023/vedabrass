{% extends "layouts/admin.html" %}
{% load static %}
{% block title %}Vedabrass | Blog Categories{% endblock %}
{% block content %}
    {% if messages %}
        <div class="message-container">
            {% for message in messages %}
            <div class="alert {{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
    {% endif %}

    <section class="dashboard-section">
        <div class="dashboard-header">
            <div>
                <h1>Edit Blog Category</h1>
                <p>Update category details</p>
            </div>
        </div>

        <form method="POST" class="form-grid" action="{% url 'AdminEditBlogCategory' category.unique_code %}">
            {% csrf_token %}
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" value="{{ category.name }}" required>
            </div>
            <div class="form-group">
                <label>Slug</label>
                <input type="text" name="slug" value="{{ category.slug }}">
            </div>
            <div class="form-group">
                <label>Status</label>
                <select name="is_active">
                    <option value="True" {% if category.is_active %}selected{% endif %}>Active</option>
                    <option value="False" {% if not category.is_active %}selected{% endif %}>Inactive</option>
                </select>
            </div>
            <button type="submit" class="btn-primary">Save Changes</button>
        </form>
    </section>
{% endblock %}
