{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block description %}{% endblock %}">
    <meta name="keywords" content="{% block keywords %}{% endblock %}">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="author" content="Doc Web India">
    <title>{% block title %}{% endblock %}</title>

    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'back/images/favicon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'back/images/favicon.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'back/images/favicon.png' %}">
    <link rel="canonical" href="" />

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{% static 'back/css/styling.css' %}">
</head>
<body>
    {% block content %}

    {% endblock %}

    <script src="{% static 'back/js/custom.js' %}"></script>
</body>
</html>
