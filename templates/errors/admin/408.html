{% extends "layouts/berror.html" %}
{% load static %}
{% block content %}
    <section class="web-error-section">
        <div class="web-error-card">
            <span class="web-error-code">408</span>
            <h1>Request Timeout</h1>
            <p>Your request took too long to complete. Please check your connection and try again.</p>

            <div class="web-error-actions">
                <a href="{% url 'Welcome' %}" class="web-error-btn primary">Go Home</a>
                <a href="{% url 'Products' %}" class="web-error-btn secondary">Shop Products</a>
            </div>
        </div>
    </section>
{% endblock %}
