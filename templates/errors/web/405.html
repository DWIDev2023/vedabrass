{% extends "layouts/cerror.html" %}
{% load static %}
{% block content %}
    <section class="web-error-section">
        <div class="web-error-card">
            <span class="web-error-code">405</span>
            <h1>Method Not Allowed</h1>
            <p>The requested action is not allowed for this page. Please go back and try again properly.</p>

            <div class="web-error-actions">
                <a href="{% url 'Welcome' %}" class="web-error-btn primary">Go Home</a>
                <a href="{% url 'Products' %}" class="web-error-btn secondary">Shop Products</a>
            </div>
        </div>
    </section>
{% endblock %}
